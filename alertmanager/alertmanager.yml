global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname="VPNNodeNeedsHeal"
      receiver: telegram-and-healer

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: -1001234567890
        send_resolved: true
        parse_mode: HTML
        message: |
          {{ range .Alerts }}
          {{ if eq .Status "firing" }}🔴 <b>ТРЕБУЕТ ВНИМАНИЯ</b>{{ else }}✅ <b>ВОССТАНОВЛЕНО</b>{{ end }}
          {{ if eq .Labels.alertname "VPNPortUnreachable" }}<b>VPN-порт недоступен</b>{{ else if eq .Labels.alertname "NodeExporterDown" }}<b>Сбор метрик ноды остановлен</b>{{ else if eq .Labels.alertname "NodeHighCPU" }}<b>Высокая загрузка CPU</b>{{ else if eq .Labels.alertname "NodeLowMemory" }}<b>Заканчивается RAM</b>{{ else if eq .Labels.alertname "NodeLowDiskSpace" }}<b>Заканчивается место на диске</b>{{ else if eq .Labels.alertname "RemnawaveContainerStopped" }}<b>Контейнер Remnawave остановлен</b>{{ else if eq .Labels.alertname "RemnawaveStateCheckStale" }}<b>Устарела проверка контейнера</b>{{ else if eq .Labels.alertname "RemnawavePanelMetricsDown" }}<b>Метрики панели недоступны</b>{{ else if eq .Labels.alertname "RemnawaveNodeDisconnected" }}<b>Нода отключена от панели</b>{{ else }}<b>{{ .Labels.alertname }}</b>{{ end }}
          🖥 Нода: <code>{{ if .Labels.node }}{{ .Labels.node }}{{ else }}не указана{{ end }}</code>
          {{ if .Labels.instance }}🔌 Адрес: <code>{{ .Labels.instance }}</code>
          {{ end }}{{ if .Annotations.description }}📝 {{ .Annotations.description }}
          {{ end }}⏱ Начало: <code>{{ .StartsAt.Format "02.01 15:04:05" }}</code>
          {{ end }}

  - name: telegram-and-healer
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: -1001234567890
        send_resolved: true
        parse_mode: HTML
        message: |
          {{ range .Alerts }}
          {{ if eq .Status "firing" }}🛠️ <b>АВТОХИЛ: СИГНАЛ ПОЛУЧЕН</b>{{ else }}✅ <b>АВТОХИЛ: ИНЦИДЕНТ ЗАКРЫТ</b>{{ end }}
          🖥 Нода: <code>{{ .Labels.node }}</code>
          {{ if .Labels.instance }}🔌 Адрес: <code>{{ .Labels.instance }}</code>
          {{ end }}{{ if .Annotations.description }}📝 {{ .Annotations.description }}
          {{ end }}⏱ Начало: <code>{{ .StartsAt.Format "02.01 15:04:05" }}</code>
          {{ end }}
    webhook_configs:
      - url: http://healer:8080/alertmanager
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/healer_bearer_token
