global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
        refresh_interval: 30s

  - job_name: vpn_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: [/etc/prometheus/vpn-targets.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Remnawave Panel's built-in authenticated Prometheus endpoint. Set the
  # panel metrics listener to a private/WireGuard-reachable address only.
  - job_name: remnawave
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/panel-targets.yml]
        refresh_interval: 30s
    basic_auth:
      username: monitoring
      password_file: /run/secrets/remnawave_metrics_password
